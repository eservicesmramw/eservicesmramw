<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .receipt-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

            .receipt-container::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 8px;
                height: 100%;
                background: linear-gradient(180deg, #0bb40b 0%, #089108 100%);
            }

        .valid-badge {
            background-color: #0bb40b;
            color: white;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(11, 180, 11, 0.2);
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }

        .receipt-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            text-align: left;
        }

        .receipt-item {
            display: flex;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

            .receipt-item:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }

        .label {
            color: #666;
            font-size: 16px;
        }

        .value {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }

        .receipt-footer {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .total-amount {
            margin-top: 20px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #0bb40b;
        }

            .total-amount .value {
                font-size: 20px;
                color: #0bb40b;
            }

        .stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            transform: rotate(12deg);
            opacity: 0.1;
            font-size: 70px;
            font-weight: bold;
            color: #0bb40b;
            letter-spacing: 1px;
            pointer-events: none;
        }
        .align-split {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .right-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            white-space: nowrap;
        }

        .invoice-number,
        .serial-number {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="receipt-container">
        <div class="stamp">VALID</div>
        <div class="valid-badge">✓ MRA VERIFIED RECEIPT</div>
        <h1>Receipt Details</h1>
        <div class="receipt-details">
            <div class="receipt-item align-split">
                <span class="label">Receipt Number:</span>
                <div class="right-value">
                    <div class="invoice-number">BYy-d-JY10-K</div>
                    <div class="serial-number">(5617-1-20260902-000002)</div>
                </div>
            </div>
            <div class="receipt-item">
                <span class="label">Seller:</span>
                <span class="value">David Hardware Suppliers</span>
            </div>
            <div class="receipt-item">
                <span class="label">Branch:</span>
                <span class="value">DAVID HARDWARE LILONGWE</span>
            </div>
            <div class="receipt-item">
                <span class="label">Transaction Date:</span>
                <span class="value">04-9-2026</span>
            </div>
            <div class="receipt-item">
                <span class="label">VAT Amount:</span>
                <span class="value">62255.32</span>
            </div>
            <div class="receipt-item">
                <span class="label">Number of Items:</span>
                <span class="value">2</span>
            </div>
        </div>

        <div class="total-amount">
            <div class="receipt-item">
                <span class="label">Invoice Amount:</span>
                <span class="value">418000.0</span>
            </div>
        </div>
    </div>

</body></html>
