<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="receipt-container">
        <div class="stamp">VALID</div>
        <div class="valid-badge">✓ MRA VERIFIED RECEIPT</div>
        <h1>Receipt Details</h1>
        <div class="receipt-details">
            <div class="receipt-item align-split">
                <span class="label">Receipt Number:</span>
                <div class="right-value">
                    <div class="invoice-number">BXx-G-JY5i-G</div>
                    <div class="serial-number">(5617-1-20260915-000002)</div>
                </div>
            </div>
            <div class="receipt-item">
                <span class="label">Seller:</span>
                <span class="value">David Hardware Suppliers</span>
            </div>
            <div class="receipt-item">
                <span class="label">Branch:</span>
                <span class="value">DAVID HARDWARE LILONGWE</span>
            </div>
            <div class="receipt-item">
                <span class="label">Transaction Date:</span>
                <span class="value">15-9-2026</span>
            </div>
            <div class="receipt-item">
                <span class="label">VAT Amount:</span>
                <span class="value">1824468.09</span>
            </div>
            <div class="receipt-item">
                <span class="label">Number of Items:</span>
                <span class="value">4</span>
            </div>
        </div>

        <div class="total-amount">
            <div class="receipt-item">
                <span class="label">Invoice Amount:</span>
                <span class="value">12250000.00</span>
            </div>
        </div>
    </div>
</body>
</html>
